<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient / Glow -->
    <radialGradient id="spaceHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#3B1261" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#1A0A30" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#100620" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A0612" stop-opacity="0" />
    </radialGradient>

    <!-- Planetary Core Sphere Gradient (Cyan to Deep Violet) -->
    <linearGradient id="planetCoreGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="28%" stop-color="#00A3FF" />
      <stop offset="62%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Inner Ring Gradient -->
    <linearGradient id="ring2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Drop Glow Filter for crispness on black -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Square Background #0A0612 -->
  <rect width="512" height="512" fill="#0A0612" />

  <!-- Center Atmospheric Dark Violet Halo -->
  <circle cx="256" cy="256" r="145" fill="url(#spaceHalo)" />

  <!-- Back Segments of Orbital Rings -->
  <!-- Ring 2 (Inner Ring - Angle ~38 deg) Back Arc -->
  <g transform="translate(256, 256) rotate(38)">
    <ellipse cx="0" cy="0" rx="146" ry="76" fill="none" stroke="url(#ring2Grad)" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Ring 1 (Outer Ring - Angle ~-34 deg) -->
  <g transform="translate(256, 256) rotate(-34)">
    <ellipse cx="0" cy="0" rx="188" ry="60" fill="none" stroke="url(#ring1Grad)" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Central Planet Sphere (Cyan to Purple Gradient) -->
  <circle cx="256" cy="256" r="44" fill="url(#planetCoreGrad)" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="44" fill="none" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5" />

  <!-- Front crossing arc of Ring 1 for true 3D overlapping depth -->
  <g transform="translate(256, 256) rotate(-34)">
    <path d="M 188 0 A 188 60 0 0 1 -188 0" fill="none" stroke="url(#ring1Grad)" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
